[project]
name = "auto-bangumi"
version = "4.0.0"
description = "AutoBangumi - Automated anime download manager"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.150.0",
    "uvicorn>=0.54",
    "httpx2[socks]>=2.15",
    "beautifulsoup4>=4.15.0",
    "sqlmodel>=0.0.48",
    "sqlalchemy[aiosqlite]>=2.1.5",
    "pydantic>=2.14.1",
    "bcrypt>=4.1",
    "cryptography>=50.0.2",
    "python-multipart>=0.0.30",
    "python-dotenv>=1.2.4",
    "Jinja2>=3.1.2",
    "openai>=3.35.1",
    "semver>=3.1.0",
    "webauthn>=2.8.0",
    "mcp>=2.3.0",
    "anthropic>=1.15.0",
    "google-genai>=2.31.0",
    "packaging>=26.3",
    "jsonschema>=4.20.0",
    "anyio>=4.16",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.1",
    "vulture>=2.16",
    # ab-plugin 命令行与 ab_sdk 轮子的打包配置（sdk/），可编辑安装，源码仍在 src/ab_sdk
    "autobangumi-sdk",
    "ty>=0.0.107",
]

[tool.pytest.ini_options]
testpaths = ["src/test"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "e2e: End-to-end integration tests (require Docker)",
]

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = [".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "PIE",   # flake8-pie
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "PERF",  # perflint
    "RUF",   # ruff 自有规则
]
ignore = [
    "E501",
    "F401",
    "B008",  # FastAPI 依赖注入惯用 `param = Depends(...)` 作为默认值
    "B905",  # zip(strict=...)：补上会改变运行时行为，不做批量修改
    "UP042", # str+Enum 改 StrEnum 会改变 str()/format() 的输出
    "RUF001", # 以下三条把全角中文标点视为易混淆字符；本项目注释与文案为中文
    "RUF002",
    "RUF003",
    "ASYNC109", # 公开 API 广泛使用 timeout 参数，改为 anyio.fail_after 需改签名
    "ASYNC240", # 主要误报 os.path.relpath/normpath 等纯字符串运算；真实文件 IO 由 ASYNC230 等覆盖
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.uv]
package = false

[tool.uv.sources]
autobangumi-sdk = { path = "sdk", editable = true }

[tool.ty.environment]
python-version = "3.14"
root = ["src"]

[tool.ty.analysis]
# module.__version__ 是构建期生成的文件，仓库中不存在（见 module/conf/config.py 的 try/except）
allowed-unresolved-imports = ["module.__version__"]

[tool.ty.rules]
# 多余的 ty: ignore 注释直接报错，避免抑制注释在代码修好后残留
unused-ignore-comment = "error"

[tool.vulture]
# 死代码检查：新的未使用函数/类/方法会让 CI 失败。框架通过装饰器注册的入口
# （路由、校验器等）由 ignore_decorators 排除；仅测试使用的辅助方法和 pydantic
# 字段等误报登记在 vulture_whitelist.py。
paths = ["src/module", "src/main.py", "vulture_whitelist.py"]
min_confidence = 60
ignore_decorators = [
    "@router.*",
    "@*_router.*",
    "@model_validator",
    "@field_validator",
    "@property",
    "@app.*",
    "@server.*",
    "@mcp.*",
]
